name: "ghav before: check"
"on":
  push:
    branches:
      - ghav/dev/6642
    paths:
      - .ghav/before
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.23.2"
          cache: true
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download Go modules
        run: go mod download
      - name: Check types
        run: cd platform && bun tsc --noEmit
      - name: Build platform
        run: ./platform/scripts/build
        env:
          DOCKER_PUSH: false
      - name: Go vet
        run: go vet ./...
      - name: Run Go tests
        run: go test ./...
      - name: Build CLI
        run: go build -o sst ./cmd/sst
      - name: Build docs
        run: cd www && bun run build
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Fetch tags
        run: git fetch --force --tags
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.23.2"
      - name: Download Go modules
        run: go mod download
      - name: Install dependencies
        run: bun i --frozen-lockfile
      - name: TypeScript check
        run: cd platform && bun tsc --noEmit
      - name: Build platform
        run: ./platform/scripts/build
        env:
          DOCKER_PUSH: false
      - name: Build CLI
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: build --snapshot --clean
